[pytest]
; log_cli 开启后，会在跑脚本的时候在终端控制台打印详细日志,这里关闭，让控制台保持整洁
log_cli = false
log_cli_level = INFO
log_format = %(asctime)s.%(msecs)03d (%(filename)-16s:%(lineno)s) %(levelname)-8s %(message)s
log_cli_format = %(asctime)s.%(msecs)03d (%(filename)-16s:%(lineno)-3s) %(levelname)-8s %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
addopts = --disable-warnings
bdd_features_base_dir = features/